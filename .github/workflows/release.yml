name: Release

# Thin caller — the actual pipeline (test gate → sign → notarize → DMG →
# appcast → GitHub Release → Homebrew cask) lives in
# privacykey/gh-workflows (.github/workflows/macos-sparkle-release.yml,
# pinned @v1). See that repo's README for the release-script contract
# and the secret layout.
#
# Secret scopes (names only; values live in GitHub):
#   • APPLE_* — privacykey org secrets, shared by every macOS app repo.
#   • SPARKLE_PRIVATE_KEY — this repo (intended home: the macos-signing
#     environment). Environment secrets only resolve inside the called
#     workflow's release job — which declares `environment:
#     macos-signing` — so this caller MUST use `secrets: inherit`;
#     an explicit `secrets:` mapping resolves in the caller's context
#     (no environment) and would come back empty.
#   • HOMEBREW_TAP_TOKEN — optional; the cask-publish step skips
#     cleanly until it exists.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to release as (e.g. v0.2.0). Must match MARKETING_VERSION.'
        required: true

# Deliberate duplication of the called workflow's concurrency block:
# GitHub evaluates workflow-level concurrency of a *called* workflow
# inconsistently, so both sides declare it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# A called workflow can only reduce the caller's token permissions,
# never raise them — contents: write is needed to publish the Release
# and push the appcast branch. Inside the reusable workflow the test
# job runs with contents: read; only its release job uses write.
permissions:
  contents: write

jobs:
  release:
    uses: privacykey/gh-workflows/.github/workflows/macos-sparkle-release.yml@v1
    with:
      xcodeproj: privacycommand/privacycommand.xcodeproj
      scheme: privacycommand
      # The .xcodeproj is committed, not generated.
      uses_xcodegen: false
      appcast_branch: gh-pages
      # privacycommand has always attached the dSYM to the public
      # Release (anyone with a crash log can symbolicate); keep that.
      # The reusable default (false) would make symbols private-only.
      publish_dsym: true
      # Renders packaging/homebrew/privacycommand.rb and pushes it to
      # the tap — replaces the manual version/sha256 bump in
      # privacykey/homebrew-tap. Skips cleanly until the
      # HOMEBREW_TAP_TOKEN secret exists.
      cask_name: privacycommand
      tap_repo: privacykey/homebrew-tap
      # Empty on tag pushes (the reusable workflow falls back to the
      # triggering ref name); set by workflow_dispatch re-releases.
      release_tag: ${{ inputs.release_tag || '' }}
    secrets: inherit
