name: App CI

# Builds and tests the Xcode app target (privacycommand.app +
# privacycommandTests) via the shared reusable workflow — unsigned, no
# secrets. Complements ci.yml, which covers the SPM package targets
# (Core, auditctlKit, auditctl, guest agent) on pull requests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same ref/PR cancels an in-flight run. Declared here
# as well as in the called workflow — GitHub evaluates workflow-level
# concurrency of a *called* workflow inconsistently.
concurrency:
  group: app-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read

jobs:
  ci:
    uses: privacykey/gh-workflows/.github/workflows/macos-app-ci.yml@17c26982bea3999cc60fbc18ac094b164319b9cd # Source provenance and project publication gates
    with:
      xcodeproj: privacycommand/privacycommand.xcodeproj
      scheme: privacycommand
